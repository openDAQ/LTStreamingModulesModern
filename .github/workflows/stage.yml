name: Build LT streaming module stagings

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve the core commit
    runs-on: ubuntu-latest
    outputs:
      core-sha: ${{ steps.core.outputs.core-sha }}
      channel: ${{ steps.core.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the core commit and the publish channel
        id: core
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          core_ref=$(cat opendaq_ref)
          core_sha=$(gh api "/repos/openDAQ/openDAQ/commits/$core_ref" --jq .sha) \
            || { echo "::error::opendaq_ref names no commit of openDAQ/openDAQ: $core_ref"; exit 1; }

          case "$GITHUB_REF" in
            refs/heads/release/*) channel=stable ;;
            refs/heads/main)      channel=dev    ;;
            *)                    channel=test   ;;
          esac

          echo "core-sha=$core_sha" >> "$GITHUB_OUTPUT"
          echo "channel=$channel"   >> "$GITHUB_OUTPUT"
          echo "opendaq_ref $core_ref -> $core_sha, channel $channel"

  stage:
    needs: resolve
    name: LtStreamingModulesModern
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/stage.yml@jira/TBBAS-3439-multi-staging
    with:
      timeout: '[{"timeout-minutes": 180}]'
      staging-pull: >-
        [
          { "artifact": "core-windows-2022-x86_64-msvs-v143-release",   "packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "windows",        "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-windows-2022-x86-msvs-v143-release",      "packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "windows",        "com.opendaq.settings.arch": "x86"    } }] },
          { "artifact": "core-manylinux_2_28-x86_64-ninja-gcc-release", "packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "manylinux_2_28", "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-ubuntu-22.04-x86_64-ninja-gcc-release",   "packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "linux",          "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-ubuntu-22.04-armv8-ninja-gcc-release",    "packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "linux",          "com.opendaq.settings.arch": "armv8"  } }] },
          { "artifact": "core-macos-26-x86_64-ninja-appleclang-release","packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "macos",          "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-macos-26-armv8-ninja-appleclang-release", "packages": [{ "path": "ghcr.io/openDAQ/test/staging/opendaq", "tag": "${{ needs.resolve.outputs.core-sha }}", "annotations": { "com.opendaq.custom.platform": "macos",          "com.opendaq.settings.arch": "armv8"  } }] }
        ]
      include-jobs: >-
        [
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "manylinux_2_28-x86_64-ninja-gcc-release",
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "macos-26-x86_64-ninja-appleclang-release",
          "macos-26-armv8-ninja-appleclang-release"
        ]
      packages: >-
        [
          { "match-jobs": ["windows-2022-x86_64-msvs-v143-release"],   "artifacts": [{ "name": "core-windows-2022-x86_64-msvs-v143-release",    "dir": "staging-deps" }] },
          { "match-jobs": ["windows-2022-x86-msvs-v143-release"],      "artifacts": [{ "name": "core-windows-2022-x86-msvs-v143-release",       "dir": "staging-deps" }] },
          { "match-jobs": ["manylinux_2_28-x86_64-ninja-gcc-release"], "artifacts": [{ "name": "core-manylinux_2_28-x86_64-ninja-gcc-release",  "dir": "staging-deps" }] },
          { "match-jobs": ["ubuntu-22.04-x86_64-ninja-gcc-release"],   "artifacts": [{ "name": "core-ubuntu-22.04-x86_64-ninja-gcc-release",    "dir": "staging-deps" }] },
          { "match-jobs": ["ubuntu-22.04-armv8-ninja-gcc-release"],    "artifacts": [{ "name": "core-ubuntu-22.04-armv8-ninja-gcc-release",     "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-x86_64-ninja-appleclang-release"],"artifacts": [{ "name": "core-macos-26-x86_64-ninja-appleclang-release", "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-armv8-ninja-appleclang-release"], "artifacts": [{ "name": "core-macos-26-armv8-ninja-appleclang-release",  "dir": "staging-deps" }] }
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "stage",
            "cache-variables":
            {
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps;${sourceDir}/staging-deps/opt/opendaq"
            }
          },
          {
            "match-jobs": ["macos-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "stagings": [{"name": "lt-streaming"}]
          }
        ]
      staging-push: >-
        [
          {
            "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.channel }}/staging/lt-streaming-modules",
            "artifacts": ["staging-*/lt-streaming"],
            "tags": ["latest"]
          }
        ]
