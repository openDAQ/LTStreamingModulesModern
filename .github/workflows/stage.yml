name: Build LT streaming module stagings

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      opendaq-ref:
        description: "openDAQ commit, branch or tag. If empty, uses the opendaq_ref file from the repo."
        default: ""


jobs:
  resolve:
    name: Resolve the core commit
    runs-on: ubuntu-latest
    outputs:
      core-ref: ${{ steps.core.outputs.ref }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - uses: openDAQ/openDAQ-CI/.github/actions/resolve-channel@jira/TBBAS-3547-staging-pull-by-annotations
        id: channel

      # the input, or else opendaq_ref; a branch or a tag is resolved to the commit, which is
      # what the core staging is found by and what this staging records
      - name: Resolve the core commit
        id: core
        shell: bash
        env:
          REF: ${{ inputs.opendaq-ref }}
        run: |
          ref="${REF:-$(cat opendaq_ref)}"
          sha="$ref"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            sha=$(git ls-remote https://github.com/openDAQ/openDAQ "$ref" "$ref^{}" | sort -k2 | tail -1 | cut -f1)
          fi
          [ -n "$sha" ] || { echo "::error::$ref names no openDAQ commit"; exit 1; }
          echo "core: $ref -> $sha"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

  stage:
    needs: resolve
    name: LtStreamingModulesModern
    permissions:
      contents: read
      packages: write
    uses: openDAQ/openDAQ-CI/.github/workflows/stage.yml@jira/TBBAS-3547-staging-pull-by-annotations
    with:
      timeout: '[{"timeout-minutes": 180}]'
      staging-pull: >-
        [
          { "artifact": "core-windows-2022-x86_64-msvs-v143-release",   "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "windows",        "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-windows-2022-x86-msvs-v143-release",      "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "windows",        "com.opendaq.settings.arch": "x86"    } }] },
          { "artifact": "core-manylinux_2_28-x86_64-ninja-gcc-14-release", "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "manylinux_2_28", "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-manylinux_2_28-armv8-ninja-gcc-14-release",  "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "manylinux_2_28", "com.opendaq.settings.arch": "armv8"  } }] },
          { "artifact": "core-ubuntu-22.04-x86_64-ninja-gcc-release",   "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "linux",          "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-ubuntu-22.04-armv8-ninja-gcc-release",    "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "linux",          "com.opendaq.settings.arch": "armv8"  } }] },
          { "artifact": "core-macos-26-x86_64-ninja-appleclang-21-release","packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "macos",          "com.opendaq.settings.arch": "x86_64" } }] },
          { "artifact": "core-macos-26-armv8-ninja-appleclang-21-release", "packages": [{ "path": "ghcr.io/openDAQ/${{ needs.resolve.outputs.channel }}/staging/opendaq", "annotations": { "org.opencontainers.image.revision": "${{ needs.resolve.outputs.core-ref }}", "com.opendaq.custom.platform": "macos",          "com.opendaq.settings.arch": "armv8"  } }] }
        ]
      include-jobs: >-
        [
          "windows-2022-x86_64-msvs-v143-release",
          "windows-2022-x86-msvs-v143-release",
          "manylinux_2_28-x86_64-ninja-gcc-14-release",
          "manylinux_2_28-armv8-ninja-gcc-14-release",
          "ubuntu-22.04-x86_64-ninja-gcc-release",
          "ubuntu-22.04-armv8-ninja-gcc-release",
          "macos-26-x86_64-ninja-appleclang-21-release",
          "macos-26-armv8-ninja-appleclang-21-release"
        ]
      packages: >-
        [
          { "match-jobs": ["windows-2022-x86_64-msvs-v143-release"],   "artifacts": [{ "name": "core-windows-2022-x86_64-msvs-v143-release",    "dir": "staging-deps" }] },
          { "match-jobs": ["windows-2022-x86-msvs-v143-release"],      "artifacts": [{ "name": "core-windows-2022-x86-msvs-v143-release",       "dir": "staging-deps" }] },
          { "match-jobs": ["manylinux_2_28-x86_64-ninja-gcc-14-release"], "artifacts": [{ "name": "core-manylinux_2_28-x86_64-ninja-gcc-14-release",  "dir": "staging-deps" }] },
          { "match-jobs": ["manylinux_2_28-armv8-ninja-gcc-14-release"],  "artifacts": [{ "name": "core-manylinux_2_28-armv8-ninja-gcc-14-release",   "dir": "staging-deps" }] },
          { "match-jobs": ["ubuntu-22.04-x86_64-ninja-gcc-release"],   "artifacts": [{ "name": "core-ubuntu-22.04-x86_64-ninja-gcc-release",    "dir": "staging-deps" }] },
          { "match-jobs": ["ubuntu-22.04-armv8-ninja-gcc-release"],    "artifacts": [{ "name": "core-ubuntu-22.04-armv8-ninja-gcc-release",     "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-x86_64-ninja-appleclang-21-release"],"artifacts": [{ "name": "core-macos-26-x86_64-ninja-appleclang-21-release", "dir": "staging-deps" }] },
          { "match-jobs": ["macos-26-armv8-ninja-appleclang-21-release"], "artifacts": [{ "name": "core-macos-26-armv8-ninja-appleclang-21-release",  "dir": "staging-deps" }] },

          { "match-jobs": ["ubuntu-*"],        "apt-install": ["libssl-dev"] },
          { "match-jobs": ["manylinux*"],      "yum-install": ["openssl-devel"] },
          { "match-jobs": ["windows-*-x86-*"], "run": "vcpkg install openssl:x86-windows; Add-Content -Path $env:GITHUB_PATH -Value C:\\vcpkg\\installed\\x86-windows\\bin -Encoding utf8" }
        ]
      cmake-presets: >-
        [
          {
            "match-jobs": ["*"],
            "configure-preset": "stage",
            "cache-variables":
            {
              "CMAKE_PREFIX_PATH": "${sourceDir}/staging-deps;${sourceDir}/staging-deps/opt/opendaq",
              "CPACK_OPENDAQ_META_FIELDS": "dependencies/opendaq/revision=${{ needs.resolve.outputs.core-ref }}"
            }
          },
          {
            "match-jobs": ["macos-*-x86_64-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "10.15"}
          },
          {
            "match-jobs": ["macos-*-armv8-*"],
            "cache-variables": {"CMAKE_OSX_DEPLOYMENT_TARGET": "11.0"}
          },
          {
            "match-jobs": ["windows-*-x86-*"],
            "cache-variables": {"OPENSSL_ROOT_DIR": "C:/vcpkg/installed/x86-windows"}
          }
        ]
      cpack-presets: >-
        [
          {
            "match-jobs": ["*"],
            "stagings": [{"name": "lt-streaming"}]
          }
        ]
      staging-push: >-
        [
          {
            "path": "ghcr.io/${{ github.repository_owner }}/${{ needs.resolve.outputs.channel }}/staging/lt-streaming-modules",
            "artifacts": ["staging-*/lt-streaming"],
            "tags": ["latest"]
          }
        ]
